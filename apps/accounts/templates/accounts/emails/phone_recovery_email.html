<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回注册手机号</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f6f5;font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif;color:#26312f;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{ preview_text }}</div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;border-collapse:collapse;background:#f4f6f5;">
      <tr>
        <td align="center" style="padding:28px 12px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:600px;border-collapse:collapse;background:#ffffff;border:1px solid #e3e9e7;border-radius:18px;">
            <tr>
              <td style="padding:22px 24px;border-bottom:1px solid #edf1ef;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="border-collapse:collapse;">
                  <tr>
                    <td style="width:44px;vertical-align:middle;">
                      <img src="cid:{{ brand_icon_cid }}" alt="" width="40" height="40" style="display:block;width:40px;height:40px;border-radius:10px;object-fit:cover;">
                    </td>
                    <td style="padding-left:12px;vertical-align:middle;font-size:15px;line-height:1.4;font-weight:700;color:#26312f;">{{ brand_name }}</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 24px 12px;font-size:16px;line-height:1.75;color:#3f4b48;">你申请了找回注册手机号。下面是该邮箱绑定账号的完整登录号码。</td>
            </tr>
            <tr>
              <td style="padding:8px 24px 22px;">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;border-collapse:collapse;background:#eef8f5;border:1px solid #d6ebe4;border-radius:14px;">
                  <tr>
                    <td align="center" style="padding:18px 16px 6px;font-size:12px;line-height:1.5;color:#65736f;">完整登录号码</td>
                  </tr>
                  <tr>
                    <td align="center" style="padding:0 16px 20px;font-size:30px;line-height:1.25;font-weight:800;color:#155f52;word-break:break-all;overflow-wrap:anywhere;">{{ login_number }}</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:0 24px 8px;">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;border-collapse:collapse;">
                  <tr>
                    <td style="padding:11px 12px;border-bottom:1px solid #edf1ef;font-size:14px;line-height:1.5;color:#65736f;">国家区号</td>
                    <td align="right" style="padding:11px 12px;border-bottom:1px solid #edf1ef;font-size:15px;line-height:1.5;font-weight:700;color:#26312f;word-break:break-all;">{{ country_code }}</td>
                  </tr>
                  <tr>
                    <td style="padding:11px 12px;font-size:14px;line-height:1.5;color:#65736f;">注册手机号</td>
                    <td align="right" style="padding:11px 12px;font-size:15px;line-height:1.5;font-weight:700;color:#26312f;word-break:break-all;">{{ telephone }}</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:14px 24px 8px;font-size:14px;line-height:1.75;color:#4f5c58;">登录时请选择上面的国家区号，并输入原始手机号。手机号开头的 <strong>0 必须保留</strong>。</td>
            </tr>
            {% if frontend_base_url %}
            <tr>
              <td align="center" style="padding:18px 24px 8px;">
                <a href="{{ frontend_base_url }}" style="display:inline-block;min-width:150px;padding:13px 22px;border-radius:10px;background:#176f60;color:#ffffff;text-decoration:none;font-size:14px;line-height:1.3;font-weight:700;text-align:center;">前往登录</a>
              </td>
            </tr>
            {% endif %}
            <tr>
              <td style="padding:20px 24px 28px;font-size:12px;line-height:1.7;color:#7a8682;text-align:center;">如果这不是你的操作，可以忽略这封邮件。此邮件不会修改账号信息。</td>
            </tr>
          </table>
          <div style="padding-top:14px;font-size:11px;line-height:1.6;color:#89938f;text-align:center;">这是一封系统邮件，请勿直接回复。</div>
        </td>
      </tr>
    </table>
  </body>
</html>
