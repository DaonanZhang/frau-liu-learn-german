<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码重置验证码</title>
  </head>
  <body style="margin:0;padding:24px 12px;background:#f6f3ee;font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif;color:#2f2a25;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">
      {{ preview_text }}
    </div>

    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-collapse:collapse;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px;border-collapse:collapse;">
            <tr>
              <td style="padding:0 0 18px;">
                <div style="background:linear-gradient(135deg,#f7e7cf 0%,#d7f3eb 58%,#f6dbe0 100%);border-radius:26px;padding:28px 28px 24px;box-shadow:0 22px 50px rgba(76,58,43,0.12);text-align:center;">
                  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-collapse:collapse;">
                    <tr>
                      <td style="vertical-align:middle;text-align:center;">
                        <table role="presentation" cellspacing="0" cellpadding="0" style="border-collapse:collapse;margin:0 auto;">
                          <tr>
                            <td style="width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,0.88);text-align:center;vertical-align:middle;">
                              <img src="cid:{{ brand_icon_cid }}" alt="{{ brand_name }}" width="42" height="42" style="display:block;margin:8px auto;border-radius:12px;object-fit:cover;">
                            </td>
                            <td style="padding-left:14px;">
                              <div style="font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#7a6856;">{{ brand_name }}</div>
                              <div style="font-size:28px;line-height:1.2;font-weight:700;color:#2f2a25;padding-top:6px;">重置你的学习密码</div>
                            </td>
                          </tr>
                        </table>
                      </td>
                    </tr>
                    <tr>
                      <td style="padding-top:18px;font-size:15px;line-height:1.8;color:#594d41;text-align:center;">
                        {{ username }}，你好。我们收到了你的密码重置请求。请输入下面这组 6 位验证码来继续操作。
                      </td>
                    </tr>
                    <tr>
                      <td style="padding-top:22px;text-align:center;">
                        <div style="border-radius:22px;background:rgba(255,255,255,0.82);padding:18px 20px;border:1px solid rgba(122,104,86,0.12);max-width:360px;margin:0 auto;">
                          <div style="font-size:12px;color:#8a7764;letter-spacing:0.18em;text-transform:uppercase;">Verification Code</div>
                          <div style="padding-top:10px;font-size:36px;line-height:1;font-weight:800;letter-spacing:0.28em;color:#1f6f62;">
                            {{ code }}
                          </div>
                        </div>
                      </td>
                    </tr>
                    <tr>
                      <td style="padding-top:18px;font-size:14px;line-height:1.75;color:#6c5c4d;text-align:center;">
                        验证码将在 <strong>15 分钟</strong> 后失效。如果这不是你的操作，可以直接忽略这封邮件，你的账号不会被修改。
                      </td>
                    </tr>
                    {% if frontend_base_url %}
                    <tr>
                      <td style="padding-top:22px;text-align:center;">
                        <a href="{{ frontend_base_url }}" style="display:inline-block;padding:13px 22px;border-radius:999px;background:#1f6f62;color:#ffffff;text-decoration:none;font-size:14px;font-weight:700;">
                          返回符号刘的德语素材库
                        </a>
                      </td>
                    </tr>
                    {% endif %}
                  </table>
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:0 10px;text-align:center;font-size:12px;line-height:1.7;color:#8c7d6f;">
                这是一封系统邮件，请勿直接回复。<br>
                符号刘的德语素材库，专为德语学习设计的网站。
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
